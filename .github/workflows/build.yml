name: Build DrivePulseTrips APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unzip Project
        run: |
          mkdir -p extracted_project
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository."
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted_project -maxdepth 3 -name 'settings.gradle.kts' | head -n 1)")
          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload DrivePulseTrips APK
        uses: actions/upload-artifact@v4
        with:
          name: DrivePulseTrips-APK
          path: "extracted_project/**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          
